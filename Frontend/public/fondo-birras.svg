<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" role="img" aria-label="Dos jarras de cerveza brindando" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Cerveza: ámbar arriba, canela abajo -->
    <linearGradient id="cerveza" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b13c"/>
      <stop offset="0.55" stop-color="#e08a22"/>
      <stop offset="1" stop-color="rgb(210,105,30)"/>
    </linearGradient>
    <!-- Vidrio -->
    <linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f7f2"/>
      <stop offset="1" stop-color="#cfd9d1"/>
    </linearGradient>

    <!-- Jarra: origen en el centro de la base, crece hacia arriba (y negativo) -->
    <g id="jarra">
      <!-- Asa -->
      <path d="M -68 -190 C -128 -196 -132 -86 -64 -78" fill="none" stroke="rgb(101,67,33)" stroke-width="22" stroke-linecap="round"/>
      <path d="M -68 -190 C -128 -196 -132 -86 -64 -78" fill="none" stroke="url(#vidrio)" stroke-width="12" stroke-linecap="round"/>

      <!-- Cuerpo de vidrio -->
      <path d="M -74 -215 L 74 -215 L 66 -14 Q 65 0 52 0 L -52 0 Q -65 0 -66 -14 Z"
            fill="url(#vidrio)" stroke="rgb(101,67,33)" stroke-width="6" stroke-linejoin="round"/>

      <!-- Cerveza -->
      <path d="M -63 -190 L 63 -190 L 57 -24 Q 56 -14 46 -14 L -46 -14 Q -56 -14 -57 -24 Z" fill="url(#cerveza)"/>

      <!-- Reflejo de luz sobre la cerveza -->
      <path d="M -50 -170 L -38 -170 L -36 -40 L -46 -40 Z" fill="#ffe9a8" opacity="0.45"/>

      <!-- Burbujas -->
      <g fill="#fff3c4" opacity="0.8">
        <circle cx="-22" cy="-150" r="3"/>
        <circle cx="10" cy="-132" r="2.5"/>
        <circle cx="32" cy="-160" r="3.5"/>
        <circle cx="-8" cy="-108" r="2"/>
        <circle cx="26" cy="-90" r="3"/>
        <circle cx="-30" cy="-84" r="2.5"/>
        <circle cx="4" cy="-64" r="2"/>
        <circle cx="38" cy="-52" r="2.5"/>
        <circle cx="-18" cy="-44" r="3"/>
        <circle cx="-4" cy="-170" r="2"/>
      </g>

      <!-- Fondo grueso de vidrio -->
      <path d="M -60 -12 L 60 -12 L 58 -4 Q 56 4 48 4 L -48 4 Q -56 4 -58 -4 Z" fill="#e6ede7" opacity="0.7"/>

      <!-- Brillo del vidrio -->
      <path d="M -66 -208 L -58 -208 L -52 -12 L -58 -12 Z" fill="#ffffff" opacity="0.65"/>

      <!-- Espuma -->
      <path d="M -80 -206
               C -98 -226 -86 -262 -54 -254
               C -50 -290 -6 -296 6 -266
               C 24 -292 72 -280 70 -246
               C 92 -244 92 -212 74 -206
               L 70 -196
               C 66 -176 56 -176 54 -196
               L 48 -204
               L -58 -204
               C -60 -180 -72 -180 -74 -200
               Z"
            fill="rgb(245,245,220)" stroke="rgb(101,67,33)" stroke-width="5" stroke-linejoin="round"/>
      <!-- Sombras de la espuma -->
      <g fill="rgb(245,222,179)">
        <path d="M -60 -224 C -50 -214 -40 -214 -30 -224 C -28 -204 -52 -202 -60 -208 Z"/>
        <path d="M 14 -262 C 24 -250 40 -250 48 -258 C 52 -236 28 -230 14 -240 Z"/>
        <path d="M 54 -216 C 64 -212 70 -218 72 -226 C 76 -210 66 -204 54 -206 Z"/>
      </g>
    </g>

    <!-- Gota para las salpicaduras -->
    <path id="gota" d="M 0 -14 C 8 -4 10 4 5 9 C 0 13 -6 12 -8 6 C -10 0 -4 -6 0 -14 Z"/>
  </defs>

  <!-- Jarra derecha (espejada) -->
  <g transform="translate(430 440) scale(-1 1) rotate(14)">
    <use href="#jarra"/>
  </g>

  <!-- Jarra izquierda -->
  <g transform="translate(170 440) rotate(14)">
    <use href="#jarra"/>
  </g>

  <!-- Salpicaduras del brindis -->
  <g fill="rgb(245,245,220)" stroke="rgb(101,67,33)" stroke-width="3" stroke-linejoin="round">
    <use href="#gota" transform="translate(262 92) scale(1.5) rotate(-18)"/>
    <use href="#gota" transform="translate(300 62) scale(1.9)"/>
    <use href="#gota" transform="translate(342 100) scale(1.3) rotate(22)"/>
    <use href="#gota" transform="translate(318 128) scale(0.9) rotate(10)"/>
  </g>
</svg>
